[project]
name = "robotfpga"
version = "0.2.0"
description = "Fine-tuned SmolVLA for an SO-101 arm on the AMD Kria KR260 FPGA, full precision"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
rl = ["jax>=0.7", "matplotlib>=3.8"]  # SGS, PPO, run comparison (docs/smolvla-post-training.md); uv sync --group rl
calib = ["mujoco==3.14.0", "opencv-python-headless>=4.9"]  # policy/calib; uv sync --group calib
sim = ["imageio-ffmpeg>=0.5", "mujoco==3.14.0", "pillow>=10", "pyarrow>=15"]  # policy/sim; uv sync --group sim
gpu = [  # policy/sim/teacher_mjx.py; uv sync --group gpu
    "jax[cuda12]>=0.7; sys_platform == 'linux'",
    "jax>=0.7; sys_platform != 'linux'",
    "mujoco-mjx==3.14.0",
    "mujoco-warp==3.14.0",
]

[tool.uv]
package = false  # scripts and tools, not an installable package; SmolVLA runs in its own LeRobot env

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["robot/toolkit"]  # verbatim copy of psamin/roboticsexp so101/

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]  # not an installable package; tests import policy.* from the repo root
testpaths = ["tests"]

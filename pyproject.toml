[project]
name = "armlab"
version = "0.1.0"
description = "Tiny int8 robot policy for the KR260: sim, data, training, quantization, eval"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.14.0",
    "numpy>=2.0",
    "torch>=2.7,<2.12",
    "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
data = ["lerobot[dataset]==0.6.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["armlab"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["ref", "hls", "board"]  # FPGA-side code keeps its own lint settings

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fpga-engine:
    name: lint + full-precision engine C model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy ruff
      - name: Lint
        run: ruff check
      - name: Engine C model vs float64 reference
        run: make -C fpga/hls test
